<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wheather app</title>
    <link rel="stylesheet" href="/weather-app-img/style.css">
</head>
<body>
<div class="card">
    <div class="search">
        <input class="js-cityname" type="text" placeholder="enter city name" >
        <button class="js-button"><img src="/weather-app-img/images/search.png" alt=""></button>
    </div>
    <div class="wheather">
        <p class="date"></p>
        <img src="/weather-app-img/images/rain.png" class="css-weather-icon js-weather-icon">
       
        <h1 class="temp">Hello!</h1>
       
        <h2 class="city">Check weather and air condition.</h2>
        <p class="js-info"></p>
     <p class="js-airpara css-airpara"></p>
        
        
        <div class="details">
            <div class="col">
                <img src="/weather-app-img/images/humidity.png" alt="">
                <div class="div">
                    <p class="humidity"></p>
                    <p>humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="/weather-app-img/images/wind.png" alt="">
                <div class="div">
                    <p class="wind"></p>
                    <p>wind speed</p>
                </div>
            </div>
             <div class="col">
                <img src="/weather-app-img/images/Screenshot 2025-08-25 141654.png" alt="">
                <div class="div">
                    <p class="pressure"></p>
                    <p>pressure</p>
                </div>
            </div>
        </div>
    </div>
    <p class="footer">for more information check this <a href="https://www.accuweather.com">link</a></p>
</div>
<img src="" alt="">
<script src="/weather-app-img/script1.js"></script>
</body>
</html>
